# Perfetto trace config for diagnosing second-scale jank in com.edicl.mikan_player
# Duration 30s. Large buffers to avoid drops during the stall.

buffers {
  size_kb: 307200
  fill_policy: RING_BUFFER
}
buffers {
  size_kb: 16384
  fill_policy: RING_BUFFER
}

buffers {
  size_kb: 16384
  fill_policy: RING_BUFFER
}

buffers {
  size_kb: 8192
  fill_policy: RING_BUFFER
}

buffers {
  size_kb: 8192
  fill_policy: RING_BUFFER
}

# ---- Linux ftrace: scheduling, binder, freq ----
data_sources {
  config {
    name: "linux.ftrace"
    target_buffer: 0
    ftrace_config {
      # main-thread block / wakeup analysis
      ftrace_events: "sched/sched_switch"
      ftrace_events: "sched/sched_wakeup"
      ftrace_events: "sched/sched_wakeup_new"
      ftrace_events: "sched/sched_waking"
      ftrace_events: "sched/sched_blocked_reason"
      ftrace_events: "sched/sched_process_exit"
      ftrace_events: "sched/sched_process_free"
      ftrace_events: "task/task_newtask"
      ftrace_events: "task/task_rename"
      # binder — CookieManager.flush / IPC ANR suspects
      ftrace_events: "binder/binder_transaction"
      ftrace_events: "binder/binder_transaction_received"
      ftrace_events: "binder/binder_transaction_alloc_buf"
      ftrace_events: "binder/binder_lock"
      ftrace_events: "binder/binder_locked"
      ftrace_events: "binder/binder_unlock"
      # cpu frequency / idle — is the stall a DVFS/throttle issue?
      ftrace_events: "power/cpu_frequency"
      ftrace_events: "power/cpu_idle"
      ftrace_events: "power/suspend_resume"
      # workqueue + irq (kernel-side stalls)
      ftrace_events: "workqueue/workqueue_execute_start"
      ftrace_events: "workqueue/workqueue_execute_end"
      # app atrace categories
      atrace_categories: "gfx"
      atrace_categories: "view"
      atrace_categories: "webview"
      atrace_categories: "wm"
      atrace_categories: "am"
      atrace_categories: "sm"
      atrace_categories: "input"
      atrace_categories: "hal"
      atrace_categories: "res"
      atrace_categories: "dalvik"
      atrace_categories: "binder_driver"
      atrace_categories: "binder_lock"
      atrace_categories: "sched"
      atrace_categories: "freq"
      atrace_apps: "com.edicl.mikan_player"
      
      atrace_apps: "*"
      
    }
  }
}

# ---- CPU 调用栈采样 ----
data_sources {
  config {
    name: "linux.perf"
    target_buffer: 0
    perf_event_config {
      timebase {
        frequency: 200
        timestamp_clock: PERF_CLOCK_MONOTONIC
      }
      callstack_sampling {
        scope {
          target_cmdline: "com.edicl.mikan_player"
        }
        kernel_frames: true
      }
    }
  }
}

# ---- 帧渲染时间线 ----
data_sources {
  config {
    name: "android.surfaceflinger.frametimeline"
  }
}

# ---- process stats: memory / oom / thread cpu ----
data_sources {
  config {
    name: "linux.process_stats"
    target_buffer: 1
    process_stats_config {
      scan_all_processes_on_start: true
      proc_stats_poll_ms: 1000
    }
  }
}

# ---- per-process memory (GC pressure during stall?) ----
data_sources {
  config {
    name: "android.sys_stats"
    target_buffer: 1
    sys_stats_config {
      meminfo_period_ms: 1000
      meminfo_counters: MEMINFO_MEM_AVAILABLE
      vmstat_period_ms: 1000
    }
  }
}

# ---- log messages (correlate our debugPrint with trace) ----
data_sources {
  config {
    name: "android.log"
    target_buffer: 2
    android_log_config {
      log_ids: LID_DEFAULT
      log_ids: LID_SYSTEM
      log_ids: LID_CRASH
    }
  }
}

duration_ms: 30000