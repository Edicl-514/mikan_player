name: Rolling Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rolling-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  metadata:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      display_version: ${{ steps.version.outputs.display_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $metadata = & ./tool/release_version.ps1 -BuildNumber ([int]$env:RUN_NUMBER) | ConvertFrom-Json
          "version=$($metadata.Version)" >> $env:GITHUB_OUTPUT
          "build_number=$($metadata.BuildNumber)" >> $env:GITHUB_OUTPUT
          "display_version=$($metadata.Display)" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $($metadata.Display)"

  build-windows:
    needs: metadata
    # windows-latest ships Visual Studio 2026 only. build_libtorrent_windows.ps1
    # resolves the matching CMake generator; pin windows-2022 if the vcpkg ports
    # ever fail to build with the newer MSVC toolset.
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
      DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
      DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
      BANGUMI_APP_ID: ${{ secrets.BANGUMI_APP_ID }}
      BANGUMI_APP_SECRET: ${{ secrets.BANGUMI_APP_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-bin: false

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-x64-windows-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-x64-windows-${{ hashFiles('vcpkg.json') }}-
            vcpkg-x64-windows-

      - name: Prepare compile-time environment
        shell: pwsh
        run: |
          $required = 'DANDANPLAY_APP_ID', 'DANDANPLAY_APP_SECRET', 'BANGUMI_APP_ID', 'BANGUMI_APP_SECRET'
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) {
              throw "Missing repository secret: $name"
            }
          }
          @"
          DANDANPLAY_APP_ID=$env:DANDANPLAY_APP_ID
          DANDANPLAY_APP_SECRET=$env:DANDANPLAY_APP_SECRET
          BANGUMI_APP_ID=$env:BANGUMI_APP_ID
          BANGUMI_APP_SECRET=$env:BANGUMI_APP_SECRET
          "@ | Set-Content -Path .env -Encoding utf8

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      # Built here as well as from windows/CMakeLists.txt: `flutter build windows`
      # filters MSBuild output, so a failure inside these scripts shows up only as
      # an opaque MSB8066. Running them first keeps the real error in the log; the
      # build during `flutter build windows` is then incremental.
      - name: Build native libtorrent
        shell: pwsh
        run: ./build_libtorrent_windows.ps1 -Configuration Release

      - name: Build Rust library
        shell: pwsh
        run: ./build_windows.ps1 -BuildMode release -SkipFlutterBuild

      - name: Build Windows release
        shell: pwsh
        run: |
          flutter build windows --release `
            --build-name $env:RELEASE_VERSION `
            --build-number $env:BUILD_NUMBER
          $output = 'build/windows/x64/runner/Release'
          if (!(Test-Path $output)) { throw "Windows output not found: $output" }
          $archive = "mikan-player-windows-$env:RELEASE_VERSION+$env:BUILD_NUMBER.zip"
          Compress-Archive -Path "$output/*" -DestinationPath $archive -CompressionLevel Optimal

      # Saved even on failure so a retry does not rebuild OpenSSL and Boost.
      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-x64-windows-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: mikan-player-windows
          path: mikan-player-windows-*.zip
          if-no-files-found: error

  build-android:
    needs: metadata
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
      DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
      DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
      BANGUMI_APP_ID: ${{ secrets.BANGUMI_APP_ID }}
      BANGUMI_APP_SECRET: ${{ secrets.BANGUMI_APP_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: pwsh
        run: |
          sdkmanager 'platform-tools' 'platforms;android-37.0' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;29.0.14206865'
          if ($LASTEXITCODE -ne 0) { throw "Android SDK installation failed with exit code $LASTEXITCODE" }
          # cargo-ndk and build_libtorrent_android.ps1 both resolve the NDK from
          # these variables, and the runner image points them at its own bundled
          # NDK. Pin them to the version android/app/build.gradle.kts expects.
          $ndk = Join-Path $env:ANDROID_HOME 'ndk/29.0.14206865'
          if (!(Test-Path (Join-Path $ndk 'build/cmake/android.toolchain.cmake'))) {
            throw "Android NDK 29.0.14206865 was not found at: $ndk"
          }
          "ANDROID_NDK_HOME=$ndk" >> $env:GITHUB_ENV
          "ANDROID_NDK_ROOT=$ndk" >> $env:GITHUB_ENV

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-bin: false

      - name: Cache cargo-ndk
        id: cargo-ndk-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk.exe
          key: cargo-ndk-4.1.2-${{ runner.os }}

      - name: Install cargo-ndk
        if: steps.cargo-ndk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-arm64-android-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-arm64-android-${{ hashFiles('vcpkg.json') }}-
            vcpkg-arm64-android-

      - name: Prepare compile-time environment
        shell: pwsh
        run: |
          $required = 'DANDANPLAY_APP_ID', 'DANDANPLAY_APP_SECRET', 'BANGUMI_APP_ID', 'BANGUMI_APP_SECRET'
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) {
              throw "Missing repository secret: $name"
            }
          }
          @"
          DANDANPLAY_APP_ID=$env:DANDANPLAY_APP_ID
          DANDANPLAY_APP_SECRET=$env:DANDANPLAY_APP_SECRET
          BANGUMI_APP_ID=$env:BANGUMI_APP_ID
          BANGUMI_APP_SECRET=$env:BANGUMI_APP_SECRET
          "@ | Set-Content -Path .env -Encoding utf8

      - name: Install dependencies
        run: flutter pub get

      # Also run by Gradle during the APK build; doing it first fails fast on the
      # native side instead of 20 minutes into a Gradle run.
      - name: Build native libtorrent
        shell: pwsh
        run: |
          ./build_libtorrent_android.ps1 -Configuration MinSizeRel -Abi arm64-v8a `
            -OutputJniLibsDir (Join-Path $PWD 'android/app/src/main/jniLibs')

      - name: Build Android arm64 APK
        shell: pwsh
        run: |
          flutter build apk --release --target-platform android-arm64 `
            --build-name $env:RELEASE_VERSION `
            --build-number $env:BUILD_NUMBER `
            --split-debug-info=build/symbols/android `
            --tree-shake-icons
          $apk = 'build/app/outputs/flutter-apk/app-release.apk'
          if (!(Test-Path $apk)) { throw "Android output not found: $apk" }
          Copy-Item $apk "mikan-player-android-arm64-$env:RELEASE_VERSION+$env:BUILD_NUMBER.apk"

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-arm64-android-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: mikan-player-android
          path: mikan-player-android-*.apk
          if-no-files-found: error

  publish:
    needs: [metadata, build-windows, build-android]
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
      DISPLAY_VERSION: ${{ needs.metadata.outputs.display_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: mikan-player-*
          merge-multiple: true

      - name: Add stable rolling asset names
        shell: pwsh
        run: |
          $windows = @(Get-ChildItem release-assets -Filter 'mikan-player-windows-*.zip' -File)
          $android = @(Get-ChildItem release-assets -Filter 'mikan-player-android-arm64-*.apk' -File)
          if ($windows.Count -ne 1) { throw "Expected one Windows asset, found $($windows.Count)" }
          if ($android.Count -ne 1) { throw "Expected one Android asset, found $($android.Count)" }
          Copy-Item $windows[0].FullName 'release-assets/mikan-player-windows-latest.zip' -Force
          Copy-Item $android[0].FullName 'release-assets/mikan-player-android-arm64-latest.apk' -Force

      - name: Move rolling tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin refs/tags/rolling:refs/tags/rolling 2>$null
          git tag -f rolling $env:GITHUB_SHA
          git push origin refs/tags/rolling --force

      - name: Create or update rolling release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $title = "Rolling $env:DISPLAY_VERSION"
          $notes = @"
          Automated rolling release for commit $env:GITHUB_SHA.

          Version: $env:DISPLAY_VERSION
          This release is intentionally mutable; use the asset filename or commit SHA for traceability.
          "@
          gh release view rolling *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit rolling --title $title --notes $notes --latest
          } else {
            gh release create rolling --title $title --notes $notes --latest
          }
          gh release upload rolling release-assets/* --clobber
