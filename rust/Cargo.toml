[package]
name = "rust"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
crate-type = ["cdylib", "staticlib"]

[profile.release]
codegen-units = 1
debug = false
incremental = false
lto = "thin"
opt-level = "z"
panic = "abort"
strip = "symbols"

[dependencies]
flutter_rust_bridge = "=2.12.0"
librqbit = { version = "8.1.1", features = ["http-api", "tracing-subscriber-utils"] }
jni = "0.21"
rustls-platform-verifier = "0.6.2"

axum = "0.8"
tower-http = "0.6" # Match librqbit's version
headers = "0.4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["rc", "derive"] }
anyhow = "1.0"
log = "0.4"

env_logger = "0.11"
lazy_static = "1.5.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-roots = "1.0"
scraper = "0.26"
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1.12.2"
quick-xml = { version = "0.39.0", features = ["serialize"] }
url = "2.5.8"
urlencoding = "2.1.3"
fancy-regex = "0.17.0"
base64 = "0.22"
hex = "0.4"
futures = "0.3"
aes = "0.9"
sha2 = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "webp"] }
tract-onnx = "0.22"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
